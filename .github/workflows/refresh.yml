name: Refresh ESPN Data
on:
  push:
  workflow_dispatch: {}
  schedule:
    - cron: '0 */6 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install espn_api
      - run: python refresh_leagues.py
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/leagues.json
          git diff --quiet --cached || git commit -m "Auto-refresh"
          git push
