name: Refresh RosterIQ data

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Every 15 minutes. GitHub's scheduler is best-effort and gets slower under
    # load, so treat this as "roughly every 15-30 minutes", not a guarantee.
    # data/meta.json carries the real generatedAt timestamp, and the app shows it.
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Dependencies are installed in two groups on purpose.
      #
      # espn_api is small and stable. nfl_data_py drags in pandas/numpy/pyarrow and
      # is by far the most likely thing to fail resolution on any given day. If that
      # group fails, the run should still go ahead and deliver Sleeper injuries,
      # byes, league settings, projections and the ESPN league — losing only the
      # season-production and crosswalk files, which refresh_all.py already handles
      # as an optional source and records in meta.json.
      - name: Install core dependencies
        id: core_deps
        run: |
          set -o pipefail
          mkdir -p data
          python -V 2>&1 | tee -a data/build_log.txt
          pip install --upgrade pip 2>&1 | tail -3 | tee -a data/build_log.txt
          pip install espn_api 2>&1 | tail -20 | tee -a data/build_log.txt

      - name: Install nflverse dependencies (optional)
        id: nfl_deps
        continue-on-error: true
        run: |
          set -o pipefail
          pip install "nfl_data_py" "pandas>=2.0" pyarrow 2>&1 | tail -40 | tee -a data/build_log.txt

      - name: Record dependency state
        if: always()
        run: |
          {
            echo "--- nflverse install outcome: ${{ steps.nfl_deps.outcome }}"
            echo "--- installed packages:"
            pip list 2>/dev/null | grep -iE "espn|nfl|pandas|numpy|pyarrow" || echo "(none matched)"
          } >> data/build_log.txt

      - name: Refresh all sources
        id: refresh
        continue-on-error: true
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          set -o pipefail
          echo "--- refresh_all.py starting $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> data/build_log.txt
          python refresh_all.py 2>&1 | tee -a data/build_log.txt

      # Always commit. A failed run that leaves a build log behind is diagnosable;
      # a failed run that leaves nothing behind is not.
      - name: Commit data and build log
        if: always()
        run: |
          {
            echo "--- refresh_all.py outcome: ${{ steps.refresh.outcome }}"
            echo "--- run finished $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "--- run url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> data/build_log.txt
          # keep the log from growing without bound
          tail -c 60000 data/build_log.txt > data/build_log.tmp && mv data/build_log.tmp data/build_log.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --quiet --cached; then
            echo "No data changes."
          else
            git commit -m "Auto-refresh $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi

      - name: Fail the run if the refresh itself failed
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "refresh_all.py failed - see data/build_log.txt in the repo for the captured output."
          exit 1
